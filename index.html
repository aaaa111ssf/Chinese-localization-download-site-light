<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="简约黑白风下载站，支持日间 / 夜间模式，提供模组与配套蓝图分类浏览、一键下载。">
<meta name="author" content="A Future star">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>模组下载中心</title>

<!-- 内联 SVG favicon：单色下载箭头，无额外请求 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23111' d='M12 3v10m0 0l-4-4m4 4l4-4M5 19h14' stroke='%23111' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<!-- 主题防闪烁：在首屏绘制前确定主题，避免白屏闪烁 -->
<script>
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>

<style>
  :root {
    --bg: #ffffff;
    --surface: #fafafa;
    --surface-2: #f0f0f0;
    --text: #111111;
    --text-muted: #6b6b6b;
    --border: #e2e2e2;
    --border-strong: #111111;
    --accent: #111111;
    --accent-text: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
    --radius: 14px;
  }
  [data-theme="dark"] {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface-2: #1f1f1f;
    --text: #f2f2f2;
    --text-muted: #9a9a9a;
    --border: #2a2a2a;
    --border-strong: #f2f2f2;
    --accent: #ffffff;
    --accent-text: #0d0d0d;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    transition: background .25s ease, color .25s ease;
  }
  a { color: inherit; text-decoration: none; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.3px; }
  .brand .logo {
    width: 26px; height: 26px; flex: none;
    border: 1.5px solid var(--border-strong); border-radius: 7px;
    display: grid; place-items: center;
  }
  .brand .logo svg { width: 15px; height: 15px; }
  .theme-toggle {
    width: 40px; height: 40px; flex: none;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: var(--text);
    cursor: pointer; display: grid; place-items: center;
    transition: border-color .2s ease, background .2s ease, transform .1s ease;
  }
  .theme-toggle:hover { border-color: var(--border-strong); }
  .theme-toggle:active { transform: scale(.94); }
  .theme-toggle svg { width: 18px; height: 18px; }
  [data-theme="light"] .icon-moon { display: block; }
  [data-theme="light"] .icon-sun { display: none; }
  [data-theme="dark"] .icon-moon { display: none; }
  [data-theme="dark"] .icon-sun { display: block; }

  /* ---------- 头部 ---------- */
  .hero { text-align: center; padding: 56px 20px 28px; }
  .hero h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); font-weight: 800; letter-spacing: -.6px; }
  .hero .author { margin-top: 12px; font-size: .92rem; color: var(--text-muted); }
  .hero .author b { color: var(--text); font-weight: 600; }
  .hero p.sub { margin-top: 10px; color: var(--text-muted); font-size: .95rem; }

  /* ---------- 标签页 ---------- */
  .tabs-wrap { text-align: center; }
  .tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin: 0 auto 22px; }
  .tab {
    border: 0; background: transparent; color: var(--text-muted);
    padding: 8px 26px; font-size: .92rem; font-weight: 600; cursor: pointer;
    border-radius: 9px; transition: all .18s ease;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--accent); color: var(--accent-text); }

  /* ---------- 控制条 ---------- */
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 0 0 24px; }
  .search {
    flex: 1 1 240px; min-width: 0;
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); border-radius: 11px;
    background: var(--surface); padding: 0 12px; height: 42px;
    transition: border-color .2s ease;
  }
  .search:focus-within { border-color: var(--border-strong); }
  .search svg { width: 16px; height: 16px; color: var(--text-muted); flex: none; }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    color: var(--text); font-size: .95rem; height: 100%;
  }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-muted); border-radius: 999px;
    padding: 7px 14px; font-size: .85rem; cursor: pointer;
    transition: all .18s ease; white-space: nowrap;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--text); }
  .chip.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  /* ---------- 卡片网格 ---------- */
  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    padding-bottom: 48px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    display: flex; flex-direction: column;
    transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .card:hover { border-color: var(--border-strong); transform: translateY(-3px); box-shadow: var(--shadow); }
  .thumb {
    height: 180px; display: grid; place-items: center; overflow: hidden;
    background: var(--surface-2); border-bottom: 1px solid var(--border);
    font-size: 2.4rem; font-weight: 800; color: var(--text-muted);
    letter-spacing: 1px; user-select: none;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-body { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-title { font-size: 1.02rem; font-weight: 700; line-height: 1.35; }
  .cat-tag {
    flex: none; font-size: .72rem; color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; white-space: nowrap;
  }
  .card-desc { font-size: .88rem; color: var(--text-muted); flex: 1; }
  .card-req { font-size: .8rem; color: var(--text-muted); border-left: 2px solid var(--border-strong); padding-left: 10px; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--text-muted); }
  .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: .72rem; color: var(--text-muted); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; }
  .card-author { font-size: .8rem; color: var(--text-muted); }
  .card-author b { color: var(--text); font-weight: 600; }
  .btn {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent); color: var(--accent-text);
    border: 1px solid var(--accent); border-radius: 9px;
    padding: 8px 16px; font-size: .85rem; font-weight: 600; cursor: pointer;
    transition: opacity .18s ease, transform .1s ease;
  }
  .btn:hover { opacity: .85; }
  .btn:active { transform: scale(.96); }
  .btn svg { width: 14px; height: 14px; }

  .empty { text-align: center; color: var(--text-muted); padding: 60px 20px; grid-column: 1 / -1; }

  /* ---------- 页脚 ---------- */
  .footer { border-top: 1px solid var(--border); padding: 22px 20px; text-align: center; color: var(--text-muted); font-size: .82rem; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="#top">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v10m0 0l-4-4m4 4l4-4M5 19h14"/>
        </svg>
      </span>
      <span>模组下载中心</span>
    </a>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换日间 / 夜间模式" title="切换日间 / 夜间模式">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </div>
</header>

<main id="top" class="wrap">
  <section class="hero">
    <h1>模组下载中心</h1>
    <p class="sub" id="siteSubtitle"></p>
    <p class="author">网站作者：<b id="siteAuthor"></b></p>
  </section>

  <div class="tabs-wrap">
    <nav class="tabs" id="tabs" aria-label="下载分类"></nav>
  </div>

  <div class="controls">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
      </svg>
      <input type="search" id="searchInput" placeholder="搜索名称 / 标签 / 作者 / 配套模组…" autocomplete="off">
    </label>
    <div class="filters" id="filters"></div>
  </div>

  <section class="grid" id="grid" aria-live="polite"></section>
</main>

<footer class="footer">
  <div class="wrap">
    <span id="footerAuthor"></span> · 简约黑白下载站 · 模组与配套蓝图 · 仅供学习交流使用
  </div>
</footer>

<script>
(function () {
  "use strict";

  // ===== 站点配置（按需修改） =====
  var SITE = {
    title: "模组下载中心",
    author: "A Future star",
    subtitle: "Spaceflight Simulator 中文模组 / 配套蓝图下载 · 分类浏览，一键获取"
  };

  // 数据源（纯运行时拉取，零维护）：直接拉取主仓库经 jsDelivr 的 JSON，
  // 主仓库 data/data.json、data/blueprints.json 一更新，刷新页面即同步。
  // jsDelivr 国内可达且带 CORS；离线 / file:// 打开时回退到内联兜底数据。
  var REMOTE = {
    data: "https://cdn.jsdelivr.net/gh/aaaa111ssf/Chinese-localization-download-site@main/data/data.json",
    blueprints: "https://cdn.jsdelivr.net/gh/aaaa111ssf/Chinese-localization-download-site@main/data/blueprints.json"
  };

  // 分类中文映射（未知分类显示原值）
  var CAT_LABELS = {
    "function": "部件", "engine": "发动机", "skin": "涂装",
    "tool": "工具", "planet": "星球"
  };

  var DL_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10m0 0l-4-4m4 4l4-4M5 19h14"/></svg>';

  // 站点信息填充
  document.getElementById("siteAuthor").textContent = SITE.author;
  document.getElementById("siteSubtitle").textContent = SITE.subtitle;
  document.getElementById("footerAuthor").textContent = "© " + new Date().getFullYear() + " " + SITE.author;
  document.title = SITE.title;

  // ===== 主题切换 =====
  var root = document.documentElement;
  document.getElementById("themeToggle").addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
  });

  // ===== 状态 =====
  var TABS = [ { key: "mods", label: "模组" }, { key: "blueprints", label: "蓝图" } ];
  var currentTab = "mods";
  var activeCat = "all";
  var mods = [];
  var blueprints = [];

  var tabsEl = document.getElementById("tabs");
  var filtersEl = document.getElementById("filters");
  var grid = document.getElementById("grid");
  var searchInput = document.getElementById("searchInput");

  TABS.forEach(function (t) {
    var b = document.createElement("button");
    b.className = "tab" + (t.key === currentTab ? " active" : "");
    b.type = "button";
    b.textContent = t.label;
    b.dataset.tab = t.key;
    b.addEventListener("click", function () {
      currentTab = t.key;
      Array.prototype.forEach.call(tabsEl.children, function (x) {
        x.classList.toggle("active", x.dataset.tab === t.key);
      });
      activeCat = "all";
      buildFilters();
      render();
    });
    tabsEl.appendChild(b);
  });

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function thumbHTML(item) {
    var img = (item.images && item.images[0]) ? item.images[0] : (item.image || "");
    var initial = (item.name || "?").trim().charAt(0).toUpperCase();
    return img
      ? '<div class="thumb"><img loading="lazy" decoding="async" width="320" height="180" src="' + esc(img) + '" alt="' + esc(item.name) + '"></div>'
      : '<div class="thumb">' + esc(initial) + '</div>';
  }

  function reqNames(arr) {
    return (arr || []).map(function (r) { return typeof r === "string" ? r : (r && r.name); }).filter(Boolean);
  }

  function modCard(m) {
    var meta = [];
    if (m.version) meta.push("<span>v" + esc(m.version) + "</span>");
    if (m.date) meta.push("<span>" + esc(m.date) + "</span>");
    if (m.size) meta.push("<span>" + esc(m.size) + "</span>");
    var tags = (m.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("");
    var cat = CAT_LABELS[m.category] || m.category || "";
    return '<article class="card">' + thumbHTML(m) +
      '<div class="card-body">' +
        '<div class="card-head"><h3 class="card-title">' + esc(m.name) + '</h3>' +
          (cat ? '<span class="cat-tag">' + esc(cat) + '</span>' : '') + '</div>' +
        (m.desc ? '<p class="card-desc">' + esc(m.desc) + '</p>' : '<p class="card-desc"></p>') +
        (meta.length ? '<div class="card-meta">' + meta.join("") + '</div>' : '') +
        (tags ? '<div class="card-tags">' + tags + '</div>' : '') +
        '<div class="card-foot"><span class="card-author">作者：<b>' + esc(m.author || "—") + '</b></span>' +
          '<a class="btn" href="' + esc(m.link || "#") + '" target="_blank" rel="noopener noreferrer">' + DL_SVG + '下载</a></div>' +
      '</div></article>';
  }

  function bpCard(b) {
    var meta = [];
    if (b.format) meta.push("<span>" + esc(b.format) + "</span>");
    if (b.date) meta.push("<span>" + esc(b.date) + "</span>");
    if (b.size) meta.push("<span>" + esc(b.size) + "</span>");
    var tags = (b.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("");
    var reqs = reqNames(b.requirements);
    var reqHTML = reqs.length
      ? '<div class="card-req">配套模组：' + reqs.map(esc).join("、") + '</div>'
      : "";
    return '<article class="card">' + thumbHTML(b) +
      '<div class="card-body">' +
        '<div class="card-head"><h3 class="card-title">' + esc(b.name) + '</h3>' +
          '<span class="cat-tag">蓝图</span></div>' +
        (b.desc ? '<p class="card-desc">' + esc(b.desc) + '</p>' : '<p class="card-desc"></p>') +
        reqHTML +
        (meta.length ? '<div class="card-meta">' + meta.join("") + '</div>' : '') +
        (tags ? '<div class="card-tags">' + tags + '</div>' : '') +
        '<div class="card-foot"><span class="card-author">' + (b.author ? ('作者：<b>' + esc(b.author) + '</b>') : '配套蓝图') + '</span>' +
          '<a class="btn" href="' + esc(b.link || "#") + '" target="_blank" rel="noopener noreferrer">' + DL_SVG + '下载蓝图</a></div>' +
      '</div></article>';
  }

  function currentSource() { return currentTab === "blueprints" ? blueprints : mods; }

  function buildFilters() {
    filtersEl.innerHTML = "";
    if (currentTab === "blueprints") return; // 蓝图不过滤分类
    var cats = ["all"];
    mods.forEach(function (m) { if (m.category && cats.indexOf(m.category) === -1) cats.push(m.category); });
    cats.forEach(function (c) {
      var b = document.createElement("button");
      b.className = "chip" + (c === "all" ? " active" : "");
      b.type = "button";
      b.textContent = c === "all" ? "全部" : (CAT_LABELS[c] || c);
      b.dataset.cat = c;
      b.addEventListener("click", function () {
        activeCat = c;
        Array.prototype.forEach.call(filtersEl.children, function (x) { x.classList.toggle("active", x.dataset.cat === c); });
        render();
      });
      filtersEl.appendChild(b);
    });
  }

  function render() {
    var q = (searchInput.value || "").trim().toLowerCase();
    var list = currentSource().filter(function (it) {
      if (currentTab === "mods" && activeCat !== "all" && it.category !== activeCat) return false;
      if (!q) return true;
      var hay = [it.name, it.desc, (it.tags || []).join(" "), reqNames(it.requirements).join(" "), it.author]
        .join(" ").toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    if (!list.length) {
      grid.innerHTML = '<div class="empty">没有匹配的内容，换个关键词试试～</div>';
      return;
    }
    grid.innerHTML = list.map(function (it) {
      return currentTab === "blueprints" ? bpCard(it) : modCard(it);
    }).join("");
  }

  searchInput.addEventListener("input", render);

  function loadJSON(url) {
    return fetch(url, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  // 纯运行时拉取主仓库数据（零维护：数据只在主仓库维护，刷新即最新；无本地兜底）
  function loadRemote(remote, isBp) {
    return loadJSON(remote)
      .then(function (d) { return isBp ? (d && d.blueprints ? d.blueprints : d) : d; })
      .catch(function () { return null; });
  }
  if (location.protocol.indexOf("http") === 0) {
    Promise.all([
      loadRemote(REMOTE.data, false),
      loadRemote(REMOTE.blueprints, true)
    ]).then(function (res) {
      mods = res[0] || [];
      blueprints = res[1] || [];
      buildFilters();
      render();
    });
  } else {
    // file:// 直接打开无法发起跨域请求，给出提示
    grid.innerHTML = '<div class="empty">本页需通过服务器 / 部署后访问以加载在线数据。<br>' +
      '本地预览请在本文件夹运行静态服务器（如 <code>python -m http.server</code>）后打开。</div>';
  }
})();
</script>
</body>
</html>
